name: Auf Server hochladen (Hosttech)

# Bei jeder Änderung im Ordner public/ automatisch per FTPS auf den Server.
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER   z. B. 357.hostserv.eu
#   FTP_USER     z. B. TV-TIFF
#   FTP_PASSWORD Passwort des FTP-Kontos
# Der TV erkennt die neue Version selbst und lädt sich innerhalb von 30 Sekunden neu.
on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secrets prüfen
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$S" ] || [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::FTP_SERVER, FTP_USER oder FTP_PASSWORD fehlt in den Repository-Secrets."
            exit 1
          fi

      - name: Hochladen (nur geänderte Dateien)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ./
          # Diese Dateien gehören dem Server und werden NIE überschrieben:
          exclude: |
            **/.git*
            **/.git*/**
            config.php
            config.js
            data/**
