<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Familien Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tv.css">
</head>
<body>
<div id="stage">
  <header class="top">
    <div class="clockbox">
      <div id="clock" class="clock">--:--</div>
      <div id="date" class="date"></div>
    </div>
    <div id="message" class="message hidden"></div>
    <div id="weather" class="weather"></div>
  </header>

  <main class="grid">
    <section class="panel family c-amber">
      <h2>Familien-Pinnwand</h2>
      <div id="voice"></div>
      <div id="notes" class="notes"></div>
    </section>

    <section class="panel agenda c-blue">
      <h2>Termine</h2>
      <div id="agenda"></div>
    </section>

    <div class="side">
      <div id="photo" class="photo">
        <div id="photoA" class="slide"><img class="bg" alt=""><img class="fg" alt=""></div>
        <div id="photoB" class="slide"><img class="bg" alt=""><img class="fg" alt=""></div>
        <div id="photoEmpty" class="photo-empty">Fotos über das Handy hinzufügen</div>
      </div>
      <section class="panel important c-rose">
        <h2>Wichtig</h2>
        <div id="important"></div>
      </section>
    </div>
  </main>

  <footer id="ayah" class="ayah hidden">
    <div class="orn"><span></span><i>✦</i><span></span></div>
    <div id="ayahArabic" class="ar" dir="rtl" lang="ar"></div>
    <div id="ayahText" class="tr"></div>
    <div id="ayahRef" class="ref"></div>
  </footer>

  <div id="status" class="status"></div>
</div>

<div id="night" class="night hidden"><div id="nightclock">--:--</div></div>

<script src="twemoji.min.js"></script>
<script src="config.js"></script>
<script src="tv.js"></script>
</body>
</html>
